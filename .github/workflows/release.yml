name: Release

# A release is published whenever main carries a version (package.json) that
# has no GitHub release yet, or when a v* tag is pushed. Installed apps pick
# it up on their next start via electron-updater.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            npm version "$version" --no-git-tag-version --allow-same-version
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A release counts as done only once latest.yml (read by the updater) is attached.
          assets="$(gh release view "v$version" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -qx "latest.yml" <<< "$assets"; then
            echo "Release v$version already exists, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "Removing incomplete release v$version."
              gh release delete "v$version" --cleanup-tag --yes
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test

      - name: Build installer and upload to draft release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run release 2>&1 | tee build.log

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false --latest

      - name: Report build output
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            echo "::error title=Build log (last lines)::$(tail -n 60 build.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
